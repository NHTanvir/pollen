name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Demo runs offline
        run: node dist/src/cli.js demo
      - name: Package contains what npx needs
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            for (const need of ["dist/src/cli.js", "dist/src/index.js", "dist/src/index.d.ts", "tests/fixtures/manifest.json", "LICENSE"]) {
              if (!files.includes(need)) { console.error("missing from package: " + need); process.exit(1); }
            }
            if (files.some((f) => f.startsWith("dist/tests/"))) { console.error("tests compiled into the package"); process.exit(1); }
            console.log(files.length + " files, all present");
          '

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Passes a valid document
        uses: ./
        with:
          target: tests/fixtures/valid/spec-example.json
      - name: Fails a broken document
        id: broken
        continue-on-error: true
        uses: ./
        with:
          target: tests/fixtures/invalid/web-disabled-with-endpoint.json
      - name: The broken document must fail with exit code 1
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          EXIT_CODE: ${{ steps.broken.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          test "$OUTCOME" = "failure" && test "$EXIT_CODE" = "1"
